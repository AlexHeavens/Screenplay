name: CI

# Minutes are metered: pushes to main run only the unit job, and the emulator job runs on pull requests, nightly and on demand.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'NOTICE', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'NOTICE', 'docs/**']
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with: { cache-read-only: "${{ github.ref != 'refs/heads/main' }}" }
      - run: ./gradlew --stacktrace testDebugUnitTest assembleDebug

  # The data specs (docs/data-specs.md): the tools' tests, schema changes since the last release, every golden file against its schema, and the
  # catalogue published now against its schema. The golden files are also read by the unit job's tests.
  data-specs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - run: scripts/check-data-specs.sh
      - name: Published catalogue follows its schema
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download catalogue --repo "$GITHUB_REPOSITORY" --pattern catalogue.tsv.xz --dir published
          format=$(xz --decompress --stdout published/catalogue.tsv.xz | head --lines 1 | awk '{ print $2 }')
          python3 -I scripts/validate-schema.py "schemas/catalogue/v$format.json" published/catalogue.tsv.xz

  # The device tests, including the OCR fixtures: real scans read by the real OCR, on a Gradle-managed emulator.
  device:
    needs: unit
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The emulator's userdata partition needs about 7.4 GB; a stock runner has about 4.5 GB free.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h ~
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with: { cache-read-only: "${{ github.ref != 'refs/heads/main' }}" }
      - name: Device tests
        run: >
          ./gradlew --stacktrace pixel6Api34DebugAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
      # Gradle hides the emulator's own output; on a setup failure, start it directly to print why it exited.
      - name: Emulator diagnostics
        if: failure()
        run: |
          ls -l /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check || true
          "$ANDROID_HOME/emulator/emulator" -list-avds || true
          ini=$(find ~ -path '*/gradle-managed/*' -maxdepth 6 -name 'dev*.ini' -print -quit)
          echo "managed AVD: $ini"
          ANDROID_AVD_HOME=$(dirname "$ini") \
            timeout 60 "$ANDROID_HOME/emulator/emulator" -avd "$(basename "$ini" .ini)" -no-window -no-audio \
            -gpu swiftshader_indirect -no-snapshot-save -verbose 2>&1 | tail -80 || true
      # The report is an artifact, which is slow to open; print what failed in the log, too.
      - name: Failed device tests
        if: failure()
        run: |
          for f in $(grep --recursive --files-with-matches --include='*.xml' '<failure' app/build/outputs/androidTest-results/ || true); do
            echo "::group::$f"
            grep --before-context=1 --after-context=12 '<failure' "$f" | cut --characters=1-400
            echo "::endgroup::"
          done
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: device-test-report
          path: app/build/outputs/androidTest-results/
