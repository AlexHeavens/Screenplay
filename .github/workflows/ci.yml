name: CI

# Minutes are metered: pushes to main run only the unit job, and the emulator job runs on pull requests, nightly and on demand.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'NOTICE', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'NOTICE', 'docs/**']
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { cache-read-only: "${{ github.ref != 'refs/heads/main' }}" }
      - run: ./gradlew --stacktrace testDebugUnitTest assembleDebug

  # The device tests, including the OCR fixtures: real scans read by the real OCR, on a Gradle-managed emulator.
  device:
    needs: unit
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      # The emulator's userdata partition needs about 7.4 GB; a stock runner has about 4.5 GB free.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h ~
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { cache-read-only: "${{ github.ref != 'refs/heads/main' }}" }
      - name: Device tests
        run: >
          ./gradlew --stacktrace pixel6Api34DebugAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
      # Gradle hides the emulator's own output; on a setup failure, start it directly to print why it exited.
      - name: Emulator diagnostics
        if: failure()
        run: |
          ls -l /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check || true
          "$ANDROID_HOME/emulator/emulator" -list-avds || true
          ini=$(find ~ -path '*/gradle-managed/*' -maxdepth 6 -name 'dev*.ini' -print -quit)
          echo "managed AVD: $ini"
          ANDROID_AVD_HOME=$(dirname "$ini") \
            timeout 60 "$ANDROID_HOME/emulator/emulator" -avd "$(basename "$ini" .ini)" -no-window -no-audio \
            -gpu swiftshader_indirect -no-snapshot-save -verbose 2>&1 | tail -80 || true
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-test-report
          path: app/build/outputs/androidTest-results/
