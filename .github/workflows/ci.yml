name: CI

# Minutes are metered: pushes to main run only the unit job, and the emulator job runs on pull requests, nightly and on demand.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'NOTICE', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'NOTICE', 'docs/**']
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with: { cache-read-only: "${{ github.ref != 'refs/heads/main' }}" }
      - run: ./gradlew --stacktrace testDebugUnitTest assembleDebug

  # The data specs (docs/data-specs.md): the tools' tests, schema changes since the last release, every golden file against its schema, and the
  # catalogue published now against its schema. The golden files are also read by the unit job's tests.
  data-specs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - run: scripts/check-data-specs.sh
      - name: Published catalogue follows its schema
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download catalogue --repo "$GITHUB_REPOSITORY" --pattern catalogue.tsv.xz --dir published
          format=$(xz --decompress --stdout published/catalogue.tsv.xz | head --lines 1 | awk '{ print $2 }')
          python3 -I scripts/validate-schema.py "schemas/catalogue/v$format.json" published/catalogue.tsv.xz

  # The device tests, including the OCR fixtures: real scans read by the real OCR, on a Gradle-managed emulator.
  device:
    needs: unit
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The emulator's userdata partition needs about 7.4 GB; a stock runner has about 4.5 GB free.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h ~
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with: { cache-read-only: "${{ github.ref != 'refs/heads/main' }}" }
      # The nightly run times out or fails in tests that pass on a local emulator. Record the runner's load and the
      # emulator's log while the tests run, so a slow or failed run can be read afterwards from the uploaded artifact.
      - name: Start diagnostics
        run: |
          mkdir -p "$RUNNER_TEMP/diag"
          nohup bash -c 'while true; do date -u +%T; free -m | sed -n 2p; uptime; sleep 30; done' \
            > "$RUNNER_TEMP/diag/runner.log" 2>&1 &
          nohup bash -c 'while true; do "$ANDROID_HOME/platform-tools/adb" wait-for-device logcat -v threadtime \
            >> "$RUNNER_TEMP/diag/logcat.txt"; sleep 2; done' > /dev/null 2>&1 &
      # A step limit below the job limit makes a hung run fail this step, so the steps after it still run.
      - name: Device tests
        timeout-minutes: 30
        run: >
          ./gradlew --stacktrace pixel6Api34DebugAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
      - name: Device state
        if: always()
        run: |
          adb=$ANDROID_HOME/platform-tools/adb
          "$adb" devices -l > "$RUNNER_TEMP/diag/devices.txt" 2>&1 || true
          { "$adb" shell dumpsys meminfo | head -40; "$adb" shell top -b -n 1 -m 15; } > "$RUNNER_TEMP/diag/device-state.txt" 2>&1 || true
          df -h ~ > "$RUNNER_TEMP/diag/disk.txt" 2>&1 || true
      # Gradle hides the emulator's own output; on a setup failure, start it directly to print why it exited.
      - name: Emulator diagnostics
        if: failure()
        run: |
          ls -l /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check || true
          "$ANDROID_HOME/emulator/emulator" -list-avds || true
          ini=$(find ~ -path '*/gradle-managed/*' -maxdepth 6 -name 'dev*.ini' -print -quit)
          echo "managed AVD: $ini"
          ANDROID_AVD_HOME=$(dirname "$ini") \
            timeout 60 "$ANDROID_HOME/emulator/emulator" -avd "$(basename "$ini" .ini)" -no-window -no-audio \
            -gpu swiftshader_indirect -no-snapshot-save -verbose 2>&1 | tail -80 || true
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: device-test-report
          path: |
            app/build/outputs/androidTest-results/
            ${{ runner.temp }}/diag/
