name: Book catalogue

# Rebuilds the list "Catalogue" searches (Gutenberg books plus Open Library ratings) and publishes it to the release tagged `catalogue`. See scripts/publish-catalogue.sh.
on:
  schedule:
    - cron: "17 5 * * *"   # Gutenberg rebuilds its bulk feed daily; once a day is as often as it changes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalogue
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 240   # a new Open Library dump (monthly) streams 12.6 GB, about 90 minutes from a home connection; other days take about 5
    steps:
      - uses: actions/checkout@v4
      - run: scripts/publish-catalogue.sh
        env:
          GH_TOKEN: ${{ github.token }}
