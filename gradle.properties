org.gradle.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=384m
# Idle daemons give back their RAM after 10 minutes (default 3 hours): several sessions build on one 14 GB host.
org.gradle.daemon.idletimeout=600000
# Compile Kotlin inside the Gradle daemon: one JVM instead of two (a clean build and the unit tests fit in 1 GB).
kotlin.compiler.execution.strategy=in-process
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official
